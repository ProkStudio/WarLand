name: WarLand verification

on:
  push:
    branches: [main, 'development/**', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warland-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and build pinned Fabric toolchain
        run: python3 tools/build.py clean test build
      - name: Test restore and release checks
        env:
          PYTHONPATH: tools
        run: python3 -m unittest discover -s tools/tests -v
      - name: Preserve development artifact and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warland-development-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
            build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 14

# This workflow does not deploy, start a season, toggle financial features,
# or substitute a Minecraft client/load/crash acceptance test.
