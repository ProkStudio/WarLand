name: WarLand verification

on:
  push:
    branches: [main, 'development/**', 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warland-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and build pinned Fabric toolchain
        run: |
          set +e
          python3 tools/build.py clean test build > build-verification.log 2>&1
          result=$?
          cat build-verification.log
          exit "$result"
      - name: Test restore and release checks
        env:
          PYTHONPATH: tools
        run: python3 -m unittest discover -s tools/tests -v
      - name: Preserve development artifact and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warland-development-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
            build/reports/tests/test/
            build-verification.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish bounded auth-runtime validation evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feature/auth-runtime' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build-verification.log') ? fs.readFileSync('build-verification.log','utf8') : 'No build log.';
            const lines = log.split('\n');
            const indexes = lines.map((line,index) => /error:|FAILED|tests completed|BUILD SUCCESSFUL|BUILD FAILED/.test(line) ? index : -1).filter(i => i >= 0);
            const excerpt = [...new Set(indexes.flatMap(i => lines.slice(Math.max(0,i-1),i+5)))].slice(0,90).join('\n').slice(0,10000);
            const body = 'Auth-runtime CI evidence for head `' + context.payload.pull_request.head.sha + '` (tested merge `' + context.sha + '`).\n\n```text\n' + (excerpt || lines.slice(-30).join('\n')).replace(/```/g,'---') + '\n```\n\n[Full run](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '). Compilation/unit evidence only; not live packet/crash acceptance.';
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});

# This workflow does not deploy, start a season, toggle financial features,
# or substitute a Minecraft client/load/crash acceptance test.
